<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry Collection Dashboard</title>
    <style>
        body {
            background-color: #12161a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 40px 20px;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-area {
            display: flex;
            align-items: baseline;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1 {
            font-weight: 300;
            font-size: 2rem;
            color: #f8fafc;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .dashboard-nav-links {
            display: flex;
            gap: 15px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .nav-hub-link {
            color: #64748b;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .nav-hub-link:hover {
            color: #cbd5e1;
        }

        .action-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-left: auto;
        }

        .btn-print {
            background-color: #0369a1;
            border-color: #0284c7;
            color: #f8fafc;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-print:hover {
            background-color: #0284c7;
            border-color: #0ea5e9;
        }

        .btn-refresh {
            background-color: #1e252b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh:hover {
            border-color: #475569;
            color: #f8fafc;
            background-color: #2d3742;
        }

        .spinning {
            animation: syncSpin 0.8s linear infinite;
        }

        @keyframes syncSpin {
            100% { transform: rotate(360deg); }
        }

        .live-counter {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* CONTROLS SECTION */
        .controls-panel {
            background-color: #1e252b;
            border: 1px solid #2d3742;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .filter-group, .sort-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .sort-group {
            margin-bottom: 0;
        }

        .btn {
            background-color: #12161a;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            border-color: #475569;
            color: #f8fafc;
        }

        .btn.active {
            background-color: #334155;
            color: #f8fafc;
            border-color: #475569;
        }

        .btn.btn-no-audio.active {
            background-color: #7f1d1d;
            border-color: #f87171;
            color: #fca5a5;
        }

        .btn.btn-orphan.active {
            background-color: #d97706;
            border-color: #fbbf24;
            color: #fef3c7;
        }

        /* SOURCE SUB-TOGGLES */
        .source-sub-panel {
            display: none;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: -10px;
            margin-bottom: 20px;
            padding: 12px;
            background-color: rgba(18, 22, 26, 0.4);
            border-radius: 8px;
            border-left: 3px solid #334155;
        }

        /* DATA TABLE Styling */
        .table-wrapper {
            background-color: #1e252b;
            border: 1px solid #2d3742;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.92rem;
        }

        th {
            background-color: rgba(18, 22, 26, 0.6);
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            padding: 14px 20px;
            border-bottom: 1px solid #2d3742;
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid #2d3742;
            color: #cbd5e1;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(51, 65, 85, 0.15);
        }

        .poem-dashboard-link {
            color: #f1f5f9;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
            display: inline-block;
        }

        .poem-dashboard-link:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge-yes { background-color: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-no { background-color: rgba(239, 68, 68, 0.15); color: #f87171; }
        .badge-orphan { background-color: rgba(217, 119, 6, 0.2); color: #fbbf24; }
        
        .source-text {
            font-size: 0.88rem;
        }
        .source-unpublished { color: #64748b; font-style: italic; }
        .source-published { color: #38bdf8; }
        .source-orphan-note { color: #eab308; font-family: monospace; font-size: 0.88rem; }

        .summary-bar {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #64748b;
            text-align: right;
        }

        /* HIGH-CONTRAST NATIVE PDF PRINT OVERRIDES */
        @media print {
            @page {
                margin: 15mm 20mm;
            }
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0;
            }
            .controls-panel, .summary-bar, .action-group, .dashboard-nav-links, script {
                display: none !important;
            }
            h1 {
                color: #000000 !important;
                font-size: 1.6rem;
                font-weight: bold;
                margin-bottom: 20px;
            }
            .table-wrapper {
                border: none !important;
                box-shadow: none !important;
                background: none !important;
            }
            table {
                font-size: 10pt;
                width: 100%;
            }
            th {
                background-color: #f8fafc !important;
                color: #0f172a !important;
                border-bottom: 2px solid #0f172a !important;
                font-weight: bold;
                font-size: 0.8rem;
                padding: 10px 8px;
            }
            td {
                background: none !important;
                color: #0f172a !important;
                border-bottom: 1px solid #e2e8f0 !important;
                padding: 10px 8px;
            }
            .poem-dashboard-link {
                color: #0f172a !important;
                text-decoration: none !important;
                font-weight: bold;
            }
            .status-badge {
                padding: 0;
                background: none !important;
                font-size: 9pt;
            }
            .badge-yes { color: #16a34a !important; font-weight: bold; }
            .badge-no { color: #dc2626 !important; font-weight: bold; }
            .badge-orphan { color: #b45309 !important; font-weight: bold; }
            .source-text { font-size: 9pt; }
            .source-unpublished { color: #64748b !important; font-style: italic !important; }
            .source-published { color: #0284c7 !important; font-weight: bold !important; }
            .source-orphan-note { color: #b45309 !important; font-family: monospace; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-row">
            <div class="title-area">
                <h1>Poetry Collection Dashboard</h1>
                <div class="dashboard-nav-links">
                    <a href="../index.html" class="nav-hub-link">← Home</a>
                    <span style="color: #334155;">|</span>
                    <a href="./index.html" class="nav-hub-link">Poetry Collection →</a>
                </div>
            </div>
            
            <div class="action-group">
                <button class="btn-refresh" id="dashboard-refresh-btn" onclick="triggerManualRefresh()">
                    <span id="refresh-icon-node" style="display:inline-block;">🔄</span> Refresh Data
                </button>
                <button class="btn-print" onclick="window.print()">
                    <span>🖨️</span> Print or Save PDF
                </button>
            </div>
        </div>

        <div class="controls-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="section-label" style="margin-bottom: 0;">Cross-Filters (Multiple Active Allowed)</div>
                <div class="live-counter" id="top-counter-badge">Showing: -- / -- total</div>
            </div>
            
            <div class="filter-group">
                <button class="btn active" id="filter-all" onclick="resetFilters()">All Rows</button>
                <button class="btn btn-no-audio" id="filter-audio" onclick="toggleFilter('noAudio')">No Audio</button>
                <button class="btn" id="filter-comments" onclick="toggleFilter('comments')">Has Comments</button>
                <button class="btn" id="filter-learn" onclick="toggleFilter('learn')">Has Learn More</button>
                <button class="btn" id="filter-source" onclick="toggleFilter('source')">Is Published Book</button>
                <button class="btn btn-orphan" id="filter-orphan" onclick="toggleOrphanMode()">Orphan MP3 Tracker</button>
            </div>

            <div id="source-sub-panel" class="source-sub-panel">
                <button class="btn active" id="src-any" onclick="setSourceSubFilter('any')">Any Book</button>
                <button class="btn" id="src-temple" onclick="setSourceSubFilter('temple')">The Temple of Silence</button>
                <button class="btn" id="src-seeker" onclick="setSourceSubFilter('seeker')">Take Heart, Seeker</button>
            </div>

            <div class="section-label">Sorting Engines</div>
            <div class="sort-group">
                <button class="btn active" id="sort-date-desc" onclick="setSort('date', 'desc')">Date (Newest)</button>
                <button class="btn" id="sort-date-asc" onclick="setSort('date', 'asc')">Date (Oldest)</button>
                <button class="btn" id="sort-title-asc" onclick="setSort('title', 'asc')">Title (A - Z)</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th id="th-title">Title</th>
                        <th>Audio</th>
                        <th id="th-source">Source</th>
                        <th>Date</th>
                        <th>Comments</th>
                        <th>Learn More</th>
                    </tr>
                </thead>
                <tbody id="dashboard-rows">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #64748b; font-style: italic; padding: 40px;">
                            Reading configuration array...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="summary-bar" id="summary-text"></div>
    </div>

    <script>
        let allPoems = [];
        let discoveredOrphans = []; 
        let globalCommentsList = []; 
        let activeFilters = {
            noAudio: false,
            comments: false,
            learn: false,
            source: false
        };
        let isOrphanModeActive = false; 
        let activeSourceSubFilter = 'any'; 
        let currentSort = { field: 'date', direction: 'desc' };
        let isRefreshingCurrently = false;

        const DATABASE_API_URL = "https://script.google.com/macros/s/AKfycby81aAVsgaf0uieandQPBvUj8uStY6SFhCmDQDJRi_qYnI6dNvfK1pYefyDTfkt_vLXHA/exec";

        function cleanSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').trim();
        }

        async function triggerManualRefresh() {
            if (isRefreshingCurrently) return;
            isRefreshingCurrently = true;
            
            const refreshBtn = document.getElementById('dashboard-refresh-btn');
            const iconNode = document.getElementById('refresh-icon-node');
            
            if (refreshBtn) refreshBtn.disabled = true;
            if (iconNode) iconNode.classList.add('spinning');
            
            const cacheBypassToken = `?nocache=${Date.now()}`;
            await initializeDashboard(cacheBypassToken);
            
            setTimeout(() => {
                if (refreshBtn) refreshBtn.disabled = false;
                if (iconNode) iconNode.classList.remove('spinning');
                isRefreshingCurrently = false;
            }, 600);
        }

        async function initializeDashboard(cacheBypass = '') {
            try {
                let commentsData = [];
                try {
                    const comResponse = await fetch(DATABASE_API_URL + cacheBypass);
                    if (comResponse.ok) commentsData = await comResponse.json();
                } catch (e) {
                    console.log("Database connection deferred.");
                }

                const response = await fetch('--poem-list.txt' + cacheBypass);
                if (!response.ok) throw new Error("Poem layout configuration file unreachable.");
                const rawText = await response.text();
                
                const rawBlocks = rawText.split(/-----+/);
                
                allPoems = rawBlocks.map(block => {
                    const rawLines = block.split(/\r?\n/);
                    while (rawLines.length > 0 && rawLines[0].trim() === "") rawLines.shift();
                    if (rawLines.length < 3) return null;

                    const dateRaw = rawLines[0].trim();
                    let sourceMetadataRow = rawLines[1].trim();
                    const title = rawLines[2].trim();

                    sourceMetadataRow = sourceMetadataRow.replace(/[-\s,]*centered[-\s,]*/i, '').trim();

                    let detectedSource = "Unpublished";
                    if (sourceMetadataRow.toLowerCase().includes("temple of silence")) {
                        detectedSource = "The Temple of Silence";
                    } else if (sourceMetadataRow.toLowerCase().includes("take heart")) {
                        detectedSource = "Take Heart, Seeker";
                    }

                    let bodyLines = rawLines.slice(3);
                    while (bodyLines.length > 0 && bodyLines[bodyLines.length - 1].trim() === "") bodyLines.pop();
                    const combinedRawText = bodyLines.join('\n').trimStart();
                    
                    const hasLearnMore = combinedRawText.includes('===');
                    const matchComments = Array.isArray(commentsData) ? commentsData.filter(c => c.poemTitle === title) : [];

                    const d = new Date(dateRaw);
                    const safeISOString = isNaN(d.getTime()) ? "2026-01-01" : d.toISOString().split('T')[0];

                    return {
                        title: title,
                        source: detectedSource,
                        sortDate: safeISOString,
                        displayDate: dateRaw,
                        slug: cleanSlug(title),
                        hasLearnMore: hasLearnMore,
                        commentCount: matchComments.length,
                        hasAudio: false 
                    };
                }).filter(p => p !== null);

                // ZERO RATE-LIMIT SECURITY OVERRIDE: Reads GitHub's natural local folder structure list directly
                let scrapedFilenames = [];
                try {
                    const folderResponse = await fetch('./' + cacheBypass);
                    if (folderResponse.ok) {
                        const htmlContent = await folderResponse.text();
                        
                        // Parse layout html to locate standard file structure text references
                        const stringParser = new DOMParser();
                        const parsedDocument = stringParser.parseFromString(htmlContent, 'text/html');
                        const anchorTags = parsedDocument.querySelectorAll('a');
                        
                        anchorTags.forEach(anchor => {
                            const hrefAttribute = anchor.getAttribute('href');
                            if (hrefAttribute && hrefAttribute.toLowerCase().endsWith('.mp3')) {
                                // Extract the precise filename cleanly
                                const pureFilename = hrefAttribute.split('/').pop();
                                if (!scrapedFilenames.includes(pureFilename)) {
                                    scrapedFilenames.push(pureFilename);
                                }
                            }
                        });
                    }
                } catch (e) { console.log("Directory reading redirected."); }

                // Map results cleanly 
                discoveredOrphans = [];
                const matchedSlugs = allPoems.map(p => `${p.slug}.mp3`);

                // If local indexing was successful, extract orphans directly
                if (scrapedFilenames.length > 0) {
                    scrapedFilenames.forEach(filename => {
                        const fileLower = filename.toLowerCase();
                        const hasOwner = allPoems.some(p => `${p.slug}.mp3` === fileLower);
                        
                        if (hasOwner) {
                            const ownerPoem = allPoems.find(p => `${p.slug}.mp3` === fileLower);
                            ownerPoem.hasAudio = true;
                        } else {
                            discoveredOrphans.push(filename);
                        }
                    });
                } else {
                    // Fallback to safe individual asset verification checks if folder layout index isn't serving HTML
                    const audioPromises = allPoems.map(async (poem) => {
                        poem.hasAudio = await verifyAudioTrackHeadRequest(`${poem.slug}.mp3` + cacheBypass);
                    });
                    await Promise.all(audioPromises);
                }

                applyPipeline();

            } catch (err) {
                document.getElementById('dashboard-rows').innerHTML = 
                    `<tr><td colspan="6" style="text-align: center; color: #f87171; font-style: italic; padding: 40px;">Pipeline Interrupted: ${err.message}</td></tr>`;
            }
        }

        async function verifyAudioTrackHeadRequest(url) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                return response.ok;
            } catch (e) { return false; }
        }

        function toggleOrphanMode() {
            isOrphanModeActive = !isOrphanModeActive;
            
            if (isOrphanModeActive) {
                activeFilters = { noAudio: false, comments: false, learn: false, source: false };
                ['filter-audio', 'filter-comments', 'filter-learn', 'filter-source'].forEach(id => {
                    document.getElementById(id).classList.remove('active');
                });
                document.getElementById('source-sub-panel').style.display = 'none';
                document.getElementById('filter-all').classList.remove('active');
                document.getElementById('filter-orphan').classList.add('active');
            } else {
                document.getElementById('filter-orphan').classList.remove('active');
                document.getElementById('filter-all').classList.add('active');
            }
            
            applyPipeline();
        }

        function toggleFilter(filterType) {
            isOrphanModeActive = false;
            document.getElementById('filter-orphan').classList.remove('active');
            document.getElementById('filter-all').classList.remove('active');
            
            activeFilters[filterType] = !activeFilters[filterType];
            const targetId = filterType === 'noAudio' ? 'filter-audio' : `filter-${filterType}`;
            document.getElementById(targetId).classList.toggle('active', activeFilters[filterType]);
            
            const anyActive = Object.values(activeFilters).some(v => v === true);
            if (!anyActive && !isOrphanModeActive) {
                document.getElementById('filter-all').classList.add('active');
            }

            const subPanel = document.getElementById('source-sub-panel');
            if (filterType === 'source') {
                subPanel.style.display = activeFilters.source ? 'flex' : 'none';
            }

            applyPipeline();
        }

        function setSourceSubFilter(type) {
            activeSourceSubFilter = type;
            ['src-any', 'src-temple', 'src-seeker'].forEach(id => document.getElementById(id).classList.remove('active'));
            
            if (type === 'any') document.getElementById('src-any').classList.add('active');
            if (type === 'temple') document.getElementById('src-temple').classList.add('active');
            if (type === 'seeker') document.getElementById('src-seeker').classList.add('active');
            
            applyPipeline();
        }

        function resetFilters() {
            isOrphanModeActive = false;
            activeFilters = { noAudio: false, comments: false, learn: false, source: false };
            activeSourceSubFilter = 'any';
            
            ['filter-audio', 'filter-comments', 'filter-learn', 'filter-source', 'filter-orphan'].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            document.getElementById('source-sub-panel').style.display = 'none';
            document.getElementById('filter-all').classList.add('active');
            
            applyPipeline();
        }

        function setSort(field, direction) {
            currentSort = { field: field, direction: direction };
            ['sort-date-desc', 'sort-date-asc', 'sort-title-asc'].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            
            if (field === 'date' && direction === 'desc') document.getElementById('sort-date-desc').classList.add('active');
            if (field === 'date' && direction === 'asc') document.getElementById('sort-date-asc').classList.add('active');
            if (field === 'title' && direction === 'asc') document.getElementById('sort-title-asc').classList.add('active');
            
            applyPipeline();
        }

        function applyPipeline() {
            document.getElementById('th-title').innerText = isOrphanModeActive ? "Unassociated MP3 Filename Found" : "Title";
            document.getElementById('th-source').innerText = isOrphanModeActive ? "Suggested Typo Analysis Correction" : "Source";

            if (isOrphanModeActive) {
                let sortedOrphans = [...discoveredOrphans];
                sortedOrphans.sort((a, b) => a.localeCompare(b));
                renderDashboard(sortedOrphans, true);
                return;
            }

            let processed = [...allPoems];

            if (activeFilters.noAudio) processed = processed.filter(p => !p.hasAudio);
            if (activeFilters.comments) processed = processed.filter(p => p.commentCount > 0);
            if (activeFilters.learn) processed = processed.filter(p => p.hasLearnMore);
            
            if (activeFilters.source) {
                if (activeSourceSubFilter === 'any') {
                    processed = processed.filter(p => p.source !== "Unpublished");
                } else if (activeSourceSubFilter === 'temple') {
                    processed = processed.filter(p => p.source === "The Temple of Silence");
                } else if (activeSourceSubFilter === 'seeker') {
                    processed = processed.filter(p => p.source === "Take Heart, Seeker");
                }
            }

            if (currentSort.field === 'date') {
                processed.sort((a, b) => {
                    return currentSort.direction === 'desc' 
                        ? b.sortDate.localeCompare(a.sortDate)
                        : a.sortDate.localeCompare(b.sortDate);
                });
            } else if (currentSort.field === 'title') {
                processed.sort((a, b) => a.title.localeCompare(b.title));
            }

            renderDashboard(processed, false);
        }

        function renderDashboard(dataset, isOrphanData = false) {
            const tbody = document.getElementById('dashboard-rows');
            tbody.innerHTML = "";

            const totalCount = isOrphanData ? discoveredOrphans.length : allPoems.length;
            const counterText = isOrphanData ? `Showing: ${dataset.length} / ${totalCount} orphans` : `Showing: ${dataset.length} / ${totalCount} total`;
            document.getElementById('top-counter-badge').innerText = counterText;

            if (dataset.length === 0) {
                const clearMsg = isOrphanData ? "All audio files are perfectly linked. Zero orphans found!" : "No registered poems match the criteria.";
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b; font-style: italic; padding: 30px;">${clearMsg}</td></tr>`;
                document.getElementById('summary-text').innerText = "Showing 0 metrics";
                return;
            }

            dataset.forEach(item => {
                const tr = document.createElement('tr');
                
                if (isOrphanData) {
                    // DYNAMIC ORPHAN CHECK ROW GENERATION
                    const cleanBaseName = item.replace('.mp3', '').replace(/-/g, ' ');
                    tr.innerHTML = `
                        <td style="font-family: monospace; color: #fbbf24; font-weight: 500;">${item}</td>
                        <td><span class="status-badge badge-orphan">ORPHAN</span></td>
                        <td class="source-orphan-note">Check for poem titled: <b>"${cleanBaseName}"</b></td>
                        <td style="color: #475569;">—</td>
                        <td style="color: #475569;">—</td>
                        <td><span class="status-badge badge-no">NO</span></td>
                    `;
                } else {
                    // STANDARD COLLECTION GRID ROW GENERATION
                    const audioBadge = poem = item.hasAudio 
                        ? `<span class="status-badge badge-yes">YES</span>` 
                        : `<span class="status-badge badge-no">NO</span>`;
                        
                    const learnBadge = item.hasLearnMore 
                        ? `<span class="status-badge badge-yes">YES</span>` 
                        : `<span class="status-badge badge-no">NO</span>`;

                    const sourceClass = item.source === "Unpublished" ? "source-text source-unpublished" : "source-text source-published";
                    const linkTargetUrl = `./index.html?search=${encodeURIComponent(item.title.toLowerCase())}`;

                    tr.innerHTML = `
                        <td>
                            <a href="${linkTargetUrl}" target="_blank" class="poem-dashboard-link" title="Open this poem isolated in a new window">
                                ${item.title}
                            </a>
                        </td>
                        <td>${audioBadge}</td>
                        <td class="${sourceClass}">${item.source}</td>
                        <td style="font-family: monospace; font-size: 0.85rem;">${item.displayDate}</td>
                        <td style="font-weight: ${item.commentCount > 0 ? 'bold' : 'normal'}; color: ${item.commentCount > 0 ? '#38bdf8' : '#64748b'};">
                            ${item.commentCount}
                        </td>
                        <td>${learnBadge}</td>
                    `;
                }
                tbody.appendChild(tr);
            });

            document.getElementById('summary-text').innerText = isOrphanData 
                ? `Isolating ${dataset.length} unlinked audio track files sitting in your poetry folder repository`
                : `Displaying ${dataset.length} of ${allPoems.length} metrics across the ledger`;
        }

        window.addEventListener('DOMContentLoaded', () => initializeDashboard());
    </script>
</body>
</html>
