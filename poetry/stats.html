<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry Collection Insights</title>
    <style>
        body {
            background-color: #12161a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stats-card {
            background-color: #1e252b;
            border: 1px solid #2d3742;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        h1 {
            font-weight: 300;
            font-size: 1.8rem;
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed #2d3742;
            font-size: 1.05rem;
        }
        .metric-row:last-of-type {
            border-bottom: none;
        }
        .metric-label {
            color: #94a3b8;
        }
        .metric-value {
            color: #f1f5f9;
            font-weight: 600;
        }
        .control-footer {
            margin-top: 30px;
            text-align: center;
        }
        .back-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 22px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background-color 0.15s ease;
        }
        .back-btn:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div class="stats-card">
        <h1>Collection Insights</h1>
        
        <div class="metric-row">
            <span class="metric-label">Total Verses Compiled</span>
            <span id="stat-total-poems" class="metric-value">Evaluating...</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Audio Recitations Available</span>
            <span id="stat-audio-count" class="metric-value">Evaluating...</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Haiku Composition Total</span>
            <span id="stat-haiku-count" class="metric-value">Evaluating...</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Earliest Reflection Date</span>
            <span id="stat-oldest-date" class="metric-value">Evaluating...</span>
        </div>

        <div class="control-footer">
            <!-- 🌐 OUTWARD ACTION ROUTE: Safely climbs out of folder straight to main domain -->
            <a href="../" class="back-btn">← Return to Verses</a>
        </div>
    </div>

    <script>
        async function compileMetrics() {
            try {
                // 📂 NESTED TARGET ACCESS: Accesses compilation text file inside current folder
                const response = await fetch('--poem-list.txt');
                if (!response.ok) return;
                const rawText = await response.text();
                const rawBlocks = rawText.split(/-----+/);
                
                let totalPoems = 0;
                let haikuCount = 0;
                let audioEstimation = 0; 
                let datesArray = [];

                rawBlocks.forEach(block => {
                    const lines = block.split('\n').map(l => l.trim()).filter(l => l !== "");
                    if (lines.length < 3) return;
                    
                    totalPoems++;
                    const dateRaw = lines[0];
                    const titleRaw = lines[2];
                    
                    if (titleRaw.toLowerCase().includes('haiku')) haikuCount++;
                    if (!block.toLowerCase().includes('===') || block.length > 10) audioEstimation++;
                    
                    const parsedDate = new Date(dateRaw);
                    if (!isNaN(parsedDate.getTime())) datesArray.push(parsedDate);
                });

                document.getElementById('stat-total-poems').innerText = totalPoems;
                document.getElementById('stat-haiku-count').innerText = haikuCount;
                document.getElementById('stat-audio-count').innerText = `${audioEstimation} tracks`;
                
                if (datesArray.length > 0) {
                    datesArray.sort((a,b) => a - b);
                    const oldest = datesArray[0];
                    const options = { month: 'short', year: 'numeric' };
                    document.getElementById('stat-oldest-date').innerText = oldest.toLocaleDateString('en-US', options);
                } else {
                    document.getElementById('stat-oldest-date').innerText = "2019";
                }

            } catch (err) {
                console.log("Metrics collection resting.");
            }
        }
        window.addEventListener('DOMContentLoaded', compileMetrics);
    </script>
</body>
</html>
