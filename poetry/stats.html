<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry Collection Dashboard</title>
    <style>
        body {
            background-color: #12161a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 40px 20px;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-area {
            display: flex;
            align-items: baseline;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1 {
            font-weight: 300;
            font-size: 2rem;
            color: #f8fafc;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* MINIMALIST INTERNAL HUB NAVIGATION ROW */
        .dashboard-nav-links {
            display: flex;
            gap: 15px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .nav-hub-link {
            color: #64748b;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .nav-hub-link:hover {
            color: #cbd5e1;
        }

        .btn-print {
            background-color: #0369a1;
            border-color: #0284c7;
            color: #f8fafc;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-print:hover {
            background-color: #0284c7;
            border-color: #0ea5e9;
        }

        .live-counter {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* CONTROLS SECTION */
        .controls-panel {
            background-color: #1e252b;
            border: 1px solid #2d3742;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .filter-group, .sort-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .sort-group {
            margin-bottom: 0;
        }

        .btn {
            background-color: #12161a;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            border-color: #475569;
            color: #f8fafc;
        }

        .btn.active {
            background-color: #334155;
            color: #f8fafc;
            border-color: #475569;
        }

        .btn.btn-no-audio.active {
            background-color: #7f1d1d;
            border-color: #f87171;
            color: #fca5a5;
        }

        /* SOURCE SUB-TOGGLES */
        .source-sub-panel {
            display: none;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: -10px;
            margin-bottom: 20px;
            padding: 12px;
            background-color: rgba(18, 22, 26, 0.4);
            border-radius: 8px;
            border-left: 3px solid #334155;
        }

        /* DATA TABLE Styling */
        .table-wrapper {
            background-color: #1e252b;
            border: 1px solid #2d3742;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.92rem;
        }

        th {
            background-color: rgba(18, 22, 26, 0.6);
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            padding: 14px 20px;
            border-bottom: 1px solid #2d3742;
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid #2d3742;
            color: #cbd5e1;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(51, 65, 85, 0.15);
        }

        .poem-dashboard-link {
            color: #f1f5f9;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
            display: inline-block;
        }

        .poem-dashboard-link:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge-yes { background-color: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-no { background-color: rgba(239, 68, 68, 0.15); color: #f87171; }
        
        .source-text {
            font-size: 0.88rem;
        }
        .source-unpublished { color: #64748b; font-style: italic; }
        .source-published { color: #38bdf8; }

        .summary-bar {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #64748b;
            text-align: right;
        }

        /* HIGH-CONTRAST NATIVE PDF PRINT OVERRIDES */
        @media print {
            @page {
                margin: 15mm 20mm;
            }
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0;
            }
            .controls-panel, .summary-bar, .btn-print, .dashboard-nav-links, script {
                display: none !important;
            }
            h1 {
                color: #000000 !important;
                font-size: 1.6rem;
                font-weight: bold;
                margin-bottom: 20px;
            }
            .table-wrapper {
                border: none !important;
                box-shadow: none !important;
                background: none !important;
            }
            table {
                font-size: 10pt;
                width: 100%;
            }
            th {
                background-color: #f8fafc !important;
                color: #0f172a !important;
                border-bottom: 2px solid #0f172a !important;
                font-weight: bold;
                font-size: 0.8rem;
                padding: 10px 8px;
            }
            td {
                background: none !important;
                color: #0f172a !important;
                border-bottom: 1px solid #e2e8f0 !important;
                padding: 10px 8px;
            }
            .poem-dashboard-link {
                color: #0f172a !important;
                text-decoration: none !important;
                font-weight: bold;
            }
            .status-badge {
                padding: 0;
                background: none !important;
                font-size: 9pt;
            }
            .badge-yes {
                color: #16a34a !important; 
                font-weight: bold;
            }
            .badge-no {
                color: #dc2626 !important; 
                font-weight: bold;
            }
            .source-text {
                font-size: 9pt;
            }
            .source-unpublished {
                color: #64748b !important;
                font-style: italic !important;
            }
            .source-published {
                color: #0284c7 !important; 
                font-weight: bold !important;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-row">
            <div class="title-area">
                <h1>Poetry Collection Dashboard</h1>
                <div class="dashboard-nav-links">
                    <a href="../index.html" class="nav-hub-link">← Home</a>
                    <span style="color: #334155;">|</span>
                    <a href="./index.html" class="nav-hub-link">Poetry Collection →</a>
                </div>
            </div>
            <button class="btn-print" onclick="window.print()">
                <span>🖨️</span> Print or Save PDF
            </button>
        </div>

        <div class="controls-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="section-label" style="margin-bottom: 0;">Cross-Filters (Multiple Active Allowed)</div>
                <div class="live-counter" id="top-counter-badge">Showing: -- / -- total</div>
            </div>
            
            <div class="filter-group">
                <button class="btn active" id="filter-all" onclick="resetFilters()">All Rows</button>
                <button class="btn btn-no-audio" id="filter-audio" onclick="toggleFilter('noAudio')">No Audio</button>
                <button class="btn" id="filter-comments" onclick="toggleFilter('comments')">Has Comments</button>
                <button class="btn" id="filter-learn" onclick="toggleFilter('learn')">Has Learn More</button>
                <button class="btn" id="filter-source" onclick="toggleFilter('source')">Is Published Book</button>
            </div>

            <div id="source-sub-panel" class="source-sub-panel">
                <button class="btn active" id="src-any" onclick="setSourceSubFilter('any')">Any Book</button>
                <button class="btn" id="src-temple" onclick="setSourceSubFilter('temple')">The Temple of Silence</button>
                <button class="btn" id="src-seeker" onclick="setSourceSubFilter('seeker')">Take Heart, Seeker</button>
            </div>

            <div class="section-label">Sorting Engines</div>
            <div class="sort-group">
                <button class="btn active" id="sort-date-desc" onclick="setSort('date', 'desc')">Date (Newest)</button>
                <button class="btn" id="sort-date-asc" onclick="setSort('date', 'asc')">Date (Oldest)</button>
                <button class="btn" id="sort-title-asc" onclick="setSort('title', 'asc')">Title (A - Z)</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Audio</th>
                        <th>Source</th>
                        <th>Date</th>
                        <th>Comments</th>
                        <th>Learn More</th>
                    </tr>
                </thead>
                <tbody id="dashboard-rows">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #64748b; font-style: italic; padding: 40px;">
                            Reading configuration array...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="summary-bar" id="summary-text"></div>
    </div>

    <script>
        let allPoems = [];
        let globalCommentsList = []; 
        let activeFilters = {
            noAudio: false,
            comments: false,
            learn: false,
            source: false
        };
        let activeSourceSubFilter = 'any'; 
        let currentSort = { field: 'date', direction: 'desc' };

        const DATABASE_API_URL = "https://script.google.com/macros/s/AKfycby81aAVsgaf0uieandQPBvUj8uStY6SFhCmDQDJRi_qYnI6dNvfK1pYefyDTfkt_vLXHA/exec";

        function cleanSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').trim();
        }

        async function initializeDashboard() {
            try {
                let commentsData = [];
                try {
                    const comResponse = await fetch(DATABASE_API_URL);
                    if (comResponse.ok) commentsData = await comResponse.json();
                } catch (e) {
                    console.log("Database connection deferred.");
                }

                const response = await fetch('--poem-list.txt');
                if (!response.ok) throw new Error("Poem layout configuration file unreachable.");
                const rawText = await response.text();
                
                const rawBlocks = rawText.split(/-----+/);
                
                allPoems = rawBlocks.map(block => {
                    const rawLines = block.split(/\r?\n/);
                    while (rawLines.length > 0 && rawLines[0].trim() === "") rawLines.shift();
                    if (rawLines.length < 3) return null;

                    const dateRaw = rawLines[0].trim();
                    let sourceMetadataRow = rawLines[1].trim();
                    const title = rawLines[2].trim();

                    sourceMetadataRow = sourceMetadataRow.replace(/[-\s,]*centered[-\s,]*/i, '').trim();

                    let detectedSource = "Unpublished";
                    if (sourceMetadataRow.toLowerCase().includes("temple of silence")) {
                        detectedSource = "The Temple of Silence";
                    } else if (sourceMetadataRow.toLowerCase().includes("take heart")) {
                        detectedSource = "Take Heart, Seeker";
                    }

                    let bodyLines = rawLines.slice(3);
                    while (bodyLines.length > 0 && bodyLines[bodyLines.length - 1].trim() === "") bodyLines.pop();
                    const combinedRawText = bodyLines.join('\n').trimStart();
                    
                    const hasLearnMore = combinedRawText.includes('===');
                    const matchComments = Array.isArray(commentsData) ? commentsData.filter(c => c.poemTitle === title) : [];

                    const d = new Date(dateRaw);
                    const safeISOString = isNaN(d.getTime()) ? "2026-01-01" : d.toISOString().split('T')[0];

                    return {
                        title: title,
                        source: detectedSource,
                        sortDate: safeISOString,
                        displayDate: dateRaw,
                        slug: cleanSlug(title),
                        hasLearnMore: hasLearnMore,
                        commentCount: matchComments.length,
                        hasAudio: true 
                    };
                }).filter(p => p !== null);

                for (let poem of allPoems) {
                    poem.hasAudio = await verifyAudioTrack(`${poem.slug}.mp3`);
                }

                applyPipeline();

            } catch (err) {
                document.getElementById('dashboard-rows').innerHTML = 
                    `<tr><td colspan="6" style="text-align: center; color: #f87171; font-style: italic; padding: 40px;">Pipeline Interrupted: ${err.message}</td></tr>`;
            }
        }

        function verifyAudioTrack(url) {
            return new Promise((resolve) => {
                const audio = new Audio();
                audio.src = url;
                audio.preload = "auto";
                
                audio.addEventListener('canplaythrough', () => resolve(true), { once: true });
                audio.addEventListener('error', () => resolve(false), { once: true });
                
                setTimeout(() => resolve(false), 250);
            });
        }

        function toggleFilter(filterType) {
            document.getElementById('filter-all').classList.remove('active');
            activeFilters[filterType] = !activeFilters[filterType];
            
            const targetId = filterType === 'noAudio' ? 'filter-audio' : `filter-${filterType}`;
            document.getElementById(targetId).classList.toggle('active', activeFilters[filterType]);
            
            const subPanel = document.getElementById('source-sub-panel');
            if (filterType === 'source') {
                subPanel.style.display = activeFilters.source ? 'flex' : 'none';
            }

            applyPipeline();
        }

        function setSourceSubFilter(type) {
            activeSourceSubFilter = type;
            ['src-any', 'src-temple', 'src-seeker'].forEach(id => document.getElementById(id).classList.remove('active'));
            
            if (type === 'any') document.getElementById('src-any').classList.add('active');
            if (type === 'temple') document.getElementById('src-temple').classList.add('active');
            if (type === 'seeker') document.getElementById('src-seeker').classList.add('active');
            
            applyPipeline();
        }

        function resetFilters() {
            activeFilters = { noAudio: false, comments: false, learn: false, source: false };
            activeSourceSubFilter = 'any';
            
            ['filter-audio', 'filter-comments', 'filter-learn', 'filter-source'].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            document.getElementById('source-sub-panel').style.display = 'none';
            document.getElementById('filter-all').classList.add('active');
            
            applyPipeline();
        }

        function setSort(field, direction) {
            currentSort = { field: field, direction: direction };
            ['sort-date-desc', 'sort-date-asc', 'sort-title-asc'].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            
            if (field === 'date' && direction === 'desc') document.getElementById('sort-date-desc').classList.add('active');
            if (field === 'date' && direction === 'asc') document.getElementById('sort-date-asc').classList.add('active');
            if (field === 'title' && direction === 'asc') document.getElementById('sort-title-asc').classList.add('active');
            
            applyPipeline();
        }

        function applyPipeline() {
            let processed = [...allPoems];

            if (activeFilters.noAudio) processed = processed.filter(p => !p.hasAudio);
            if (activeFilters.comments) processed = processed.filter(p => p.commentCount > 0);
            if (activeFilters.learn) processed = processed.filter(p => p.hasLearnMore);
            
            if (activeFilters.source) {
                if (activeSourceSubFilter === 'any') {
                    processed = processed.filter(p => p.source !== "Unpublished");
                } else if (activeSourceSubFilter === 'temple') {
                    processed = processed.filter(p => p.source === "The Temple of Silence");
                } else if (activeSourceSubFilter === 'seeker') {
                    processed = processed.filter(p => p.source === "Take Heart, Seeker");
                }
            }

            if (currentSort.field === 'date') {
                processed.sort((a, b) => {
                    return currentSort.direction === 'desc' 
                        ? b.sortDate.localeCompare(a.sortDate)
                        : a.sortDate.localeCompare(b.sortDate);
                });
            } else if (currentSort.field === 'title') {
                processed.sort((a, b) => a.title.localeCompare(b.title));
            }

            renderDashboard(processed);
        }

        function renderDashboard(dataset) {
            const tbody = document.getElementById('dashboard-rows');
            tbody.innerHTML = "";

            const counterText = `Showing: ${dataset.length} / ${allPoems.length} total`;
            document.getElementById('top-counter-badge').innerText = counterText;

            if (dataset.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b; font-style: italic; padding: 30px;">No registered poems match the selected cross-filter matrix criteria.</td></tr>`;
                document.getElementById('summary-text').innerText = `Showing 0 of ${allPoems.length} total metrics`;
                return;
            }

            dataset.forEach(poem => {
                const tr = document.createElement('tr');
                
                const audioBadge = poem.hasAudio 
                    ? `<span class="status-badge badge-yes">YES</span>` 
                    : `<span class="status-badge badge-no">NO</span>`;
                    
                const learnBadge = poem.hasLearnMore 
                    ? `<span class="status-badge badge-yes">YES</span>` 
                    : `<span class="status-badge badge-no">NO</span>`;

                const sourceClass = poem.source === "Unpublished" ? "source-text source-unpublished" : "source-text source-published";
                
                const linkTargetUrl = `./index.html?search=${encodeURIComponent(poem.title.toLowerCase())}`;

                tr.innerHTML = `
                    <td>
                        <a href="${linkTargetUrl}" target="_blank" class="poem-dashboard-link" title="Open this poem isolated in a new window">
                            ${poem.title}
                        </a>
                    </td>
                    <td>${audioBadge}</td>
                    <td class="${sourceClass}">${poem.source}</td>
                    <td style="font-family: monospace; font-size: 0.85rem;">${poem.displayDate}</td>
                    <td style="font-weight: ${poem.commentCount > 0 ? 'bold' : 'normal'}; color: ${poem.commentCount > 0 ? '#38bdf8' : '#64748b'};">
                        ${poem.commentCount}
                    </td>
                    <td>${learnBadge}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('summary-text').innerText = `Displaying ${dataset.length} of ${allPoems.length} metrics across the ledger`;
        }

        window.addEventListener('DOMContentLoaded', initializeDashboard);
    </script>
</body>
</html>
