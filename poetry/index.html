<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Poetry — Being Walter</title>
    <style>
        body {
            background-color: #12161a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
        }

        h1 {
            font-weight: 300;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #f8fafc;
            margin-bottom: 20px;
        }

        /* Navigation Controls */
        .nav-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background-color: #1e252b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #334155;
            color: #f8fafc;
            border-color: #475569;
        }

        /* Search Bar Styling */
        .search-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }

        .search-input {
            width: 100%;
            background-color: #1e252b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #64748b;
        }

        .search-input::placeholder {
            color: #475569;
        }

        main {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }

        .poem-card {
            background-color: #1e252b;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid #2d3742;
        }

        /* Header Layout: Title on Left, Context on Right */
        .poem-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 16px;
            gap: 15px;
        }

        h2 {
            font-weight: 400;
            font-size: 1.5rem;
            margin: 0;
            color: #f1f5f9;
        }

        /* Context Block for Date & Location */
        .poem-meta {
            font-size: 0.85rem;
            color: #64748b;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 0.5px;
            text-align: right;
            white-space: nowrap;
        }

        .poem-text {
            font-size: 1.1rem;
            white-space: pre-line;
            color: #cbd5e1;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        audio {
            width: 100%;
            margin-top: 0;
            border-radius: 8px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Collection</h1>
        
        <div class="nav-controls">
            <button class="nav-btn" id="btn-all" onclick="changeMode('all')">All Poems (A-Z)</button>
            <button class="nav-btn active" id="btn-latest" onclick="changeMode('latest')">Latest First</button>
            <button class="nav-btn" id="btn-random" onclick="changeMode('random')">Random Poem</button>
        </div>

        <div class="search-container">
            <input type="text" id="search-box" class="search-input" placeholder="Search titles..." oninput="handleSearch()">
        </div>
    </header>

    <main id="poetry-container">
        <p style="text-align: center; color: #64748b; font-style: italic;">Gathering verses...</p>
    </main>

    <footer>
        <p><a href="../" style="color: #64748b; text-decoration: none;">← Return Home</a></p>
    </footer>

    <script>
        let allPoems = [];
        let currentMode = 'latest'; // 'Latest First' is now the default mode
        let searchQuery = '';

        // Matches naming rule: lowercase, word-word.mp3
        function cleanSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').trim();
        }

        // Standardizes sorting dates
        function parseSortDate(dateStr) {
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? "2026-01-01" : d.toISOString().split('T')[0];
        }

        // Cleans up the raw date for standard display: "May 15, 2026" -> "May 2026"
        function parseHumanDate(dateStr) {
            const parts = dateStr.replace(',', '').split(' ');
            if (parts.length >= 3) {
                return `${parts[0].substring(0, 3)} ${parts[2]}`;
            }
            return dateStr;
        }

        // Reads --poem-list.txt on the fly
        async function loadPoetryData() {
            try {
                const response = await fetch('--poem-list.txt');
                if (!response.ok) throw new Error("File not found");
                const rawText = await response.text();
                
                // Split file by 5 dashes
                const rawBlocks = rawText.split(/-----+/);
                
                allPoems = rawBlocks.map(block => {
                    const rawLines = block.split(/\r?\n/).map(l => l.trimEnd());
                    
                    while (rawLines.length > 0 && rawLines[0].trim() === "") {
                        rawLines.shift();
                    }

                    if (rawLines.length < 3) return null;

                    const dateRaw = rawLines[0].trim();
                    const location = rawLines[1].trim();
                    const title = rawLines[2].trim();
                    
                    let bodyLines = rawLines.slice(3);
                    
                    while (bodyLines.length > 0 && bodyLines[bodyLines.length - 1].trim() === "") {
                        bodyLines.pop();
                    }
                    
                    if (!dateRaw || !title) return null;

                    return {
                        title: title,
                        location: location,
                        displayDate: parseHumanDate(dateRaw),
                        sortDate: parseSortDate(dateRaw),
                        slug: cleanSlug(title),
                        text: bodyLines.join('\n')
                    };
                }).filter(p => p !== null);

                render();
            } catch (err) {
                document.getElementById('poetry-container').innerHTML = 
                    `<p style="color: #64748b; text-align: center; font-style: italic;">The collection is resting at the moment.</p>`;
            }
        }

        // Runs search filter dynamically as user types
        function handleSearch() {
            searchQuery = document.getElementById('search-box').value.toLowerCase().trim();
            render();
        }

        // Builds screens based on selected order and search query
        function render() {
            const container = document.getElementById('poetry-container');
            container.innerHTML = "";
            
            // First, filter the master list based on the search box
            let displayList = allPoems.filter(poem => {
                return poem.title.toLowerCase().includes(searchQuery);
            });

            // If a search is happening, hide the "Random Poem" logic or clear constraints
            if (currentMode === 'all') {
                displayList.sort((a, b) => a.title.localeCompare(b.title));
            } else if (currentMode === 'latest') {
                displayList.sort((a, b) => b.sortDate.localeCompare(a.sortDate));
            } else if (currentMode === 'random') {
                // Only show a single random poem if the search bar is empty
                if (searchQuery === '' && displayList.length > 0) {
                    const randomIndex = Math.floor(Math.random() * displayList.length);
                    displayList = [displayList[randomIndex]];
                }
            }

            // Display message if no match is found
            if (displayList.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #64748b; font-style: italic; margin-top: 20px;">No titles match your search.</p>`;
                return;
            }

            displayList.forEach(poem => {
                const card = document.createElement('div');
                card.className = 'poem-card';
                
                let metaText = poem.displayDate;
                if (poem.location) {
                    metaText = `${poem.location} • ${poem.displayDate}`;
                }

                card.innerHTML = `
                    <div class="poem-header">
                        <h2>${poem.title}</h2>
                        <div class="poem-meta">${metaText}</div>
                    </div>
                    <p class="poem-text">${poem.text}</p>
                    <audio controls controlsList="nodownload">
                        <source src="${poem.slug}.mp3" type="audio/mp3">
                        Your browser does not support the audio element.
                    </audio>
                `;
                container.appendChild(card);
            });
        }

        function changeMode(mode) {
            currentMode = mode;
            ['btn-all', 'btn-latest', 'btn-random'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            // Clear search box if clicking 'Random Poem' to ensure it functions perfectly
            if (mode === 'random') {
                document.getElementById('search-box').value = '';
                searchQuery = '';
            }
            
            render();
        }

        window.addEventListener('DOMContentLoaded', loadPoetryData);
    </script>
</body>
</html>
