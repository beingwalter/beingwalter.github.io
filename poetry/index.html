<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Poetry — Being Walter</title>
    <style>
        body {
            background-color: #12161a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 40px;
        }

        h1 {
            font-weight: 300;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #f8fafc;
            margin-bottom: 20px;
        }

        /* Navigation Controls */
        .nav-controls {
            margin-bottom: 40px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background-color: #1e252b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #334155;
            color: #f8fafc;
            border-color: #475569;
        }

        main {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }

        .poem-card {
            background-color: #1e252b;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid #2d3742;
        }

        /* Header Layout: Title on Left, Context on Right */
        .poem-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 16px;
            gap: 15px;
        }

        h2 {
            font-weight: 400;
            font-size: 1.5rem;
            margin: 0;
            color: #f1f5f9;
        }

        /* Context Block for Date & Location */
        .poem-meta {
            font-size: 0.85rem;
            color: #64748b;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 0.5px;
            text-align: right;
            white-space: nowrap;
        }

        .poem-text {
            font-size: 1.1rem;
            white-space: pre-line;
            color: #cbd5e1;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        audio {
            width: 100%;
            margin-top: 0;
            border-radius: 8px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Collection</h1>
        
        <div class="nav-controls">
            <button class="nav-btn active" id="btn-all" onclick="changeMode('all')">All Poems (A-Z)</button>
            <button class="nav-btn" id="btn-latest" onclick="changeMode('latest')">Latest First</button>
            <button class="nav-btn" id="btn-random" onclick="changeMode('random')">Random Poem</button>
        </div>
    </header>

    <main id="poetry-container">
        <p style="text-align: center; color: #64748b; font-style: italic;">Gathering verses...</p>
    </main>

    <footer>
        <p><a href="../" style="color: #64748b; text-decoration: none;">← Return Home</a></p>
    </footer>

    <script>
        let allPoems = [];
        let currentMode = 'all';

        // Matches naming rule: lowercase, word-word.mp3
        function cleanSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').trim();
        }

        // Standardizes sorting dates
        function parseSortDate(dateStr) {
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? "2026-01-01" : d.toISOString().split('T')[0];
        }

        // Cleans up the raw date for standard display: "May 15, 2026" -> "May 2026"
        function parseHumanDate(dateStr) {
            const parts = dateStr.replace(',', '').split(' ');
            if (parts.length >= 3) {
                return `${parts[0].substring(0, 3)} ${parts[2]}`;
            }
            return dateStr;
        }

        // Reads poem-list.txt on the fly
        async function loadPoetryData() {
            try {
                const response = await fetch('poem-list.txt');
                if (!response.ok) throw new Error("File not found");
                const rawText = await response.text();
                
                // Split file by 5 dashes
                const rawBlocks = rawText.split(/-----+/);
                
                allPoems = rawBlocks.map(block => {
                    // Extract non-empty lines
                    const lines = block.split(/\r?\n/).map(l => l.trim()).filter(l => l !== "");
                    
                    // We now need at least 4 lines (Date, Title, Location, and at least 1 line of poem)
                    if (lines.length < 4) return null;

                    const dateRaw = lines[0];
                    const title = lines[1];
                    const location = lines[2];
                    const bodyLines = lines.slice(3);
                    
                    return {
                        title: title,
                        location: location,
                        displayDate: parseHumanDate(dateRaw),
                        sortDate: parseSortDate(dateRaw),
                        slug: cleanSlug(title),
                        text: bodyLines.join('\n')
                    };
                }).filter(p => p !== null);

                render();
            } catch (err) {
                document.getElementById('poetry-container').innerHTML = 
                    `<p style="color: #64748b; text-align: center; font-style: italic;">The collection is resting at the moment.</p>`;
            }
        }

        // Builds screens based on selected order
        function render() {
            const container = document.getElementById('poetry-container');
            container.innerHTML = "";
            
            let displayList = [...allPoems];

            if (currentMode === 'all') {
                displayList.sort((a, b) => a.title.localeCompare(b.title));
            } else if (currentMode === 'latest') {
                displayList.sort((a, b) => b.sortDate.localeCompare(a.sortDate));
            } else if (currentMode === 'random') {
                const randomIndex = Math.floor(Math.random() * displayList.length);
                displayList = [displayList[randomIndex]];
            }

            displayList.forEach(poem => {
                const card = document.createElement('div');
                card.className = 'poem-card';
                
                // Show location next to the date if it's not set to 'Unpublished' or blank
                let metaText = poem.displayDate;
                if (poem.location && poem.location.toLowerCase() !== 'unpublished') {
                    metaText = `${poem.location} • ${poem.displayDate}`;
                }

                card.innerHTML = `
                    <div class="poem-header">
                        <h2>${poem.title}</h2>
                        <div class="poem-meta">${metaText}</div>
                    </div>
                    <p class="poem-text">${poem.text}</p>
                    <audio controls controlsList="nodownload">
                        <source src="${poem.slug}.mp3" type="audio/mp3">
                        Your browser does not support the audio element.
                    </audio>
                `;
                container.appendChild(card);
            });
        }

        function changeMode(mode) {
            currentMode = mode;
            ['btn-all', 'btn-latest', 'btn-random'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            render();
        }

        window.addEventListener('DOMContentLoaded', loadPoetryData);
    </script>
</body>
</html>
