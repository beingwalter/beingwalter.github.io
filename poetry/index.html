<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Poetry — Being Walter</title>
    <style>
        body {
            background-color: #12161a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
        }

        h1 {
            font-weight: 300;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #f8fafc;
            margin-bottom: 20px;
        }

        /* Navigation Controls */
        .nav-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background-color: #1e252b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #334155;
            color: #f8fafc;
            border-color: #475569;
        }

        /* Search Bar Styling */
        .search-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }

        .search-input {
            width: 100%;
            background-color: #1e252b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #64748b;
        }

        .search-input::placeholder {
            color: #475569;
        }

        main {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }

        .poem-card {
            background-color: #1e252b;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid #2d3742;
        }

        .poem-header {
            margin-bottom: 20px;
            border-bottom: 1px solid #2d3742;
            padding-bottom: 12px;
        }

        h2 {
            font-weight: 400;
            font-size: 1.6rem;
            margin: 0 0 10px 0;
            color: #f1f5f9;
        }

        /* Sub-Header Metadata Row */
        .poem-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.82rem;
            color: #64748b;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 0.5px;
        }

        .meta-details {
            text-transform: uppercase;
        }

        .poem-text {
            font-size: 1.1rem;
            white-space: pre-line;
            color: #cbd5e1;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* Tiny inline play/stop button */
        .play-btn {
            background-color: transparent;
            color: #64748b;
            border: 1px solid #334155;
            padding: 4px 10px;
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .play-btn:hover {
            color: #cbd5e1;
            border-color: #475569;
        }

        .play-btn.playing {
            color: #38bdf8;
            border-color: #0369a1;
            background-color: #142430;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Collection</h1>
        
        <div class="nav-controls">
            <button class="nav-btn active" id="btn-latest" onclick="changeMode('latest')">Latest First</button>
            <button class="nav-btn" id="btn-all" onclick="changeMode('all')">Poems (A-Z)</button>
            <button class="nav-btn" id="btn-random" onclick="changeMode('random')">Random Poem</button>
        </div>

        <div class="search-container">
            <input type="text" id="search-box" class="search-input" placeholder="Search titles..." oninput="handleSearch()">
        </div>
    </header>

    <main id="poetry-container">
        <p style="text-align: center; color: #64748b; font-style: italic;">Gathering verses...</p>
    </main>

    <footer>
        <p><a href="../" style="color: #64748b; text-decoration: none;">← Return Home</a></p>
    </footer>

    <script>
        let allPoems = [];
        let currentMode = 'latest'; 
        let searchQuery = '';
        let currentlyPlayingAudio = null;
        let currentlyPlayingButton = null;

        function cleanSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').trim();
        }

        function parseSortDate(dateStr) {
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? "2026-01-01" : d.toISOString().split('T')[0];
        }

        function parseHumanDate(dateStr) {
            const parts = dateStr.replace(',', '').split(' ');
            if (parts.length >= 3) {
                return `${parts[0].substring(0, 3)} ${parts[2]}`;
            }
            return dateStr;
        }

        async function loadPoetryData() {
            try {
                const response = await fetch('--poem-list.txt');
                if (!response.ok) throw new Error("File not found");
                const rawText = await response.text();
                
                const rawBlocks = rawText.split(/-----+/);
                
                allPoems = rawBlocks.map(block => {
                    const rawLines = block.split(/\r?\n/).map(l => l.trimEnd());
                    
                    while (rawLines.length > 0 && rawLines[0].trim() === "") {
                        rawLines.shift();
                    }

                    if (rawLines.length < 3) return null;

                    const dateRaw = rawLines[0].trim();
                    const location = rawLines[1].trim();
                    const title = rawLines[2].trim();
                    
                    let bodyLines = rawLines.slice(3);
                    
                    while (bodyLines.length > 0 && bodyLines[bodyLines.length - 1].trim() === "") {
                        bodyLines.pop();
                    }
                    
                    if (!dateRaw || !title) return null;

                    return {
                        title: title,
                        location: location,
                        displayDate: parseHumanDate(dateRaw),
                        sortDate: parseSortDate(dateRaw),
                        slug: cleanSlug(title),
                        text: bodyLines.join('\n')
                    };
                }).filter(p => p !== null);

                render();
            } catch (err) {
                document.getElementById('poetry-container').innerHTML = 
                    `<p style="color: #64748b; text-align: center; font-style: italic;">The collection is resting at the moment.</p>`;
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-box').value.toLowerCase().trim();
            render();
        }

        function toggleAudio(audioId, btnElement) {
            const audio = document.getElementById(audioId);
            
            if (currentlyPlayingAudio && currentlyPlayingAudio !== audio) {
                currentlyPlayingAudio.pause();
                currentlyPlayingAudio.currentTime = 0;
                currentlyPlayingButton.classList.remove('playing');
                currentlyPlayingButton.innerHTML = `<span>▶</span> Play`;
            }

            if (audio.paused) {
                audio.play();
                btnElement.classList.add('playing');
                btnElement.innerHTML = `<span>⏸</span> Pause`;
                currentlyPlayingAudio = audio;
                currentlyPlayingButton = btnElement;
                
                audio.onended = () => {
                    btnElement.classList.remove('playing');
                    btnElement.innerHTML = `<span>▶</span> Play`;
                    currentlyPlayingAudio = null;
                    currentlyPlayingButton = null;
                };
            } else {
                audio.pause();
                btnElement.classList.remove('playing');
                btnElement.innerHTML = `<span>▶</span> Play`;
                currentlyPlayingAudio = null;
                currentlyPlayingButton = null;
            }
        }

        function render() {
            const container = document.getElementById('poetry-container');
            container.innerHTML = "";
            
            let displayList = allPoems.filter(poem => poem.title.toLowerCase().includes(searchQuery));

            if (currentMode === 'all') {
                displayList.sort((a, b) => a.title.localeCompare(b.title));
            } else if (currentMode === 'latest') {
                displayList.sort((a, b) => b.sortDate.localeCompare(a.sortDate));
            } else if (currentMode === 'random') {
                if (searchQuery === '' && displayList.length > 0) {
                    const randomIndex = Math.floor(Math.random() * displayList.length);
                    displayList = [displayList[randomIndex]];
                }
            }

            if (displayList.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #64748b; font-style: italic; margin-top: 20px;">No titles match your search.</p>`;
                return;
            }

            displayList.forEach((poem, index) => {
                const card = document.createElement('div');
                card.className = 'poem-card';
                
                let metaText = poem.displayDate;
                if (poem.location) {
                    metaText = `${poem.location}  •  ${poem.displayDate}`;
                }

                const audioId = `audio-${index}`;

                card.innerHTML = `
                    <div class="poem-header">
                        <h2>${poem.title}</h2>
                        <div class="poem-meta">
                            <span class="meta-details">${metaText}</span>
                            <button class="play-btn" onclick="toggleAudio('${audioId}', this)">
                                <span>▶</span> Play
                            </button>
                        </div>
                    </div>
                    <p class="poem-text">${poem.text}</p>
                    <audio id="${audioId}" preload="none">
                        <source src="${poem.slug}.mp3" type="audio/mp3">
                    </audio>
                `;
                container.appendChild(card);
            });
        }

        function changeMode(mode) {
            if (currentlyPlayingAudio) {
                currentlyPlayingAudio.pause();
                currentlyPlayingAudio = null;
                currentlyPlayingButton = null;
            }
            
            currentMode = mode;
            ['btn-all', 'btn-latest', 'btn-random'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            if (mode === 'random') {
                document.getElementById('search-box').value = '';
                searchQuery = '';
            }
            
            render();
        }

        window.addEventListener('DOMContentLoaded', loadPoetryData);
    </script>
</body>
</html>
