<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walter's nondual poetry</title>
    <style>
        body {
            background-color: #12161a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            line-height: 1.8;
            margin: 0;
            padding: 0 20px 40px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MAIN NAVIGATION BAR (STICKY) */
        header {
            position: sticky;
            top: 0;
            z-index: 100; 
            width: 100%;
            max-width: 600px;
            padding-top: 40px;
            padding-bottom: 20px;
            background-color: #12161a; 
            text-align: center;
        }

        h1 {
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Navigation Controls Container */
        .nav-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .nav-btn {
            background-color: #1e252b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #334155;
            color: #f8fafc;
            border-color: #475569;
        }

        /* Diminutive Home Button Styling */
        .home-btn {
            background-color: #1e252b;
            border: 1px solid #334155;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            text-decoration: none;
        }

        .home-btn:hover {
            background-color: #334155;
            border-color: #475569;
        }

        /* Search Bar Styling */
        .search-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 5px auto;
        }

        .search-input {
            width: 100%;
            background-color: #1e252b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #64748b;
        }

        .search-input::placeholder {
            color: #475569;
        }

        main {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            margin-top: 15px; 
        }

        .poem-card {
            position: relative;
            background-color: #1e252b;
            padding: 0; 
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid #2d3742;
            opacity: 1;
            transition: border-color 0.3s;
        }

        .poem-card.audio-tracking {
            border-color: #334155;
        }

        /* DYNAMIC INNER-CARD STICKY POEM HEADER */
        .poem-header {
            position: sticky;
            top: 150px; 
            z-index: 10;
            background-color: #1e252b; 
            padding: 24px 40px 16px 40px;
            border-top-left-radius: 11px;  
            border-top-right-radius: 11px;
            border-bottom: 1px solid #2d3742;
            margin: 0;
        }

        /* Handles the fade-in exclusively when changing button filters */
        .animate-presence {
            animation: emergePresence 0.6s cubic-bezier(0.215, 0.610, 0.355, 1.000) forwards;
            opacity: 0; 
        }

        @keyframes emergePresence {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Centered Poem Title */
        h2 {
            font-weight: 400;
            font-size: 1.6rem;
            margin: 0 0 12px 0;
            color: #f1f5f9;
            text-align: center;
        }

        /* Sub-Header Metadata Row */
        .poem-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.82rem;
            color: #64748b;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 0.5px;
        }

        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* OPTIMIZED BOTTOM CONTAINER */
        .bottom-control-group {
            display: flex;
            gap: 8px;
            margin-top: 5px; 
            justify-content: flex-start;
        }

        .meta-details {
            text-transform: uppercase;
            text-align: right;
        }

        /* Poem Content Block Layout */
        .poem-text {
            font-size: 1.1rem;
            white-space: pre-line;
            color: #cbd5e1;
            margin-top: 0 !important;
            padding: 30px 40px 15px 40px; 
            margin-bottom: 0;
            letter-spacing: 0.5px;
            text-align: left;
        }

        .poem-text.centered-body {
            text-align: center;
        }

        /* Context Block Style for Backstories and Explanations */
        .context-block {
            display: none; 
            margin: 0 40px 20px 40px;
            padding-top: 20px;
            border-top: 1px dashed #334155;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #94a3b8;
            letter-spacing: 0.3px;
            animation: expandDrawer 0.4s ease-out forwards;
        }

        /* INLINE COMMENT COMPONENT STYLING */
        .comment-drawer {
            display: none;
            margin: 0 40px 20px 40px;
            padding-top: 20px;
            border-top: 1px dashed #334155;
            animation: expandDrawer 0.4s ease-out forwards;
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .comment-textarea {
            width: 100%;
            background-color: #12161a;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        .comment-row-fields {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .comment-name-input {
            background-color: #12161a;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 6px 16px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.85rem;
            outline: none;
            max-width: 200px;
        }

        .comment-submit-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 6px 18px;
            border-radius: 20px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .comment-submit-btn:hover {
            background-color: #475569;
        }

        /* PUBLIC REFLECTION STACK CONTAINER */
        .comments-display-area {
            margin: 0 40px 40px 40px;
            padding-top: 15px;
            border-top: 1px solid #2d3742;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .single-reflection {
            background-color: rgba(18, 22, 26, 0.4);
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 2px solid #334155;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            animation: expandDrawer 0.3s ease-out forwards;
        }

        .reflection-author {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .reflection-body {
            font-size: 0.92rem;
            color: #cbd5e1;
            margin: 0;
            white-space: pre-line;
        }

        @keyframes expandDrawer {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Shared Button Style for Minimal Controls */
        .play-btn, .top-btn, .context-btn {
            background-color: transparent;
            color: #64748b;
            border: 1px solid #334155;
            padding: 4px 10px;
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
            white-space: nowrap;
            text-decoration: none;
        }

        .play-btn:hover, .top-btn:hover, .context-btn:hover {
            color: #cbd5e1;
            border-color: #475569;
        }

        .play-btn.playing {
            color: #38bdf8;
            border-color: #0369a1;
            background-color: #142430;
        }

        .context-btn.active-drawer {
            color: #94a3b8;
            border-color: #475569;
            background-color: #1e252b;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #475569;
            letter-spacing: 0.5px;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            body {
                padding: 0 12px 25px 12px;
            }
            header {
                padding-top: 25px; 
                padding-bottom: 15px;
            }
            .poem-header {
                padding: 20px 20px 12px 20px;
            }
            .poem-text {
                padding: 25px 20px 15px 20px;
                font-size: clamp(0.95rem, 4vw, 1.1rem) !important;
                line-height: 1.7;
            }
            .context-block, .comment-drawer, .comments-display-area {
                margin-left: 20px;
                margin-right: 20px;
            }
            .comments-display-area {
                margin-bottom: 25px;
            }
            h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <header id="page-top">
        <h1>Walter's nondual poetry</h1>
        
        <div class="nav-controls">
            <button class="nav-btn active" id="btn-latest" onclick="changeMode('latest')">Latest</button>
            <button class="nav-btn" id="btn-all" onclick="changeMode('all')">A - Z</button>
            <button class="nav-btn" id="btn-random" onclick="changeMode('random')">Random</button>
            <a href="../" class="home-btn" title="Return Home">🏠</a>
        </div>

        <div class="search-container">
            <input type="text" id="search-box" class="search-input" placeholder="Search titles..." oninput="handleSearch()">
        </div>
    </header>

    <main id="poetry-container">
        <p style="text-align: center; color: #64748b; font-style: italic;">Gathering verses...</p>
    </main>

    <footer>
        <p>Contents © Walter Cecchini</p>
    </footer>

    <script>
        let allPoems = [];
        let globalCommentsList = []; 
        let currentMode = 'latest'; 
        let searchQuery = '';
        let currentlyPlayingAudio = null;
        let currentlyPlayingButton = null;
        let isTypingSearch = false;
        
        let isAutoScrollingActive = false;
        let activeCardElement = null;

        const DATABASE_API_URL = "https://script.google.com/macros/s/AKfycby81aAVsgaf0uieandQPBvUj8uStY6SFhCmDQDJRi_qYnI6dNvfK1pYefyDTfkt_vLXHA/exec";

        function updateStickyPositions() {
            const mainHeader = document.getElementById('page-top');
            if (!mainHeader) return;
            
            const headerHeight = mainHeader.offsetHeight;
            
            const cardHeaders = document.querySelectorAll('.poem-header');
            cardHeaders.forEach(header => {
                header.style.top = `${headerHeight}px`;
            });
        }

        function cleanSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').trim();
        }

        function parseSortDate(dateStr) {
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? "2026-01-01" : d.toISOString().split('T')[0];
        }

        function parseHumanDate(dateStr) {
            const parts = dateStr.replace(',', '').split(' ');
            if (parts.length >= 3) {
                return `${parts[0].substring(0, 3)} ${parts[2]}`;
            }
            return dateStr;
        }

        async function loadPoetryData() {
            try {
                fetchCommentsDatabase();

                const response = await fetch('--poem-list.txt');
                if (!response.ok) throw new Error("File not found");
                const rawText = await response.text();
                
                const rawBlocks = rawText.split(/-----+/);
                
                allPoems = rawBlocks.map(block => {
                    const rawLines = block.split(/\r?\n/);
                    
                    while (rawLines.length > 0 && rawLines[0].trim() === "") {
                        rawLines.shift();
                    }

                    if (rawLines.length < 3) return null;

                    const dateRaw = rawLines[0].trim();
                    let locationRaw = rawLines[1].trim();
                    const title = rawLines[2].trim();
                    
                    let isCentered = false;
                    if (locationRaw.toLowerCase().includes('centered')) {
                        isCentered = true;
                        locationRaw = locationRaw
                            .replace(/[-\s,]*centered[-\s,]*/i, '')
                            .replace(/^,+|,+$/g, '')
                            .trim();
                    }

                    let bodyLines = rawLines.slice(3);
                    
                    while (bodyLines.length > 0 && bodyLines[bodyLines.length - 1].trim() === "") {
                        bodyLines.pop();
                    }
                    
                    if (!dateRaw || !title) return null;

                    const combinedRawText = bodyLines.join('\n').trimStart();
                    
                    let mainPoemText = combinedRawText;
                    let backstoryText = "";
                    
                    if (combinedRawText.includes('===')) {
                        const parts = combinedRawText.split(/===+/);
                        mainPoemText = parts[0].trimEnd();
                        backstoryText = parts[1].trim();
                    }

                    return {
                        title: title,
                        location: locationRaw,
                        isCentered: isCentered,
                        displayDate: parseHumanDate(dateRaw),
                        sortDate: parseSortDate(dateRaw),
                        slug: cleanSlug(title),
                        text: mainPoemText,
                        backstory: backstoryText
                    };
                }).filter(p => p !== null);

                const searchBox = document.getElementById('search-box');
                if (searchBox && allPoems.length > 0) {
                    searchBox.placeholder = `Search ${allPoems.length} titles...`;
                }

                isTypingSearch = false;
                render();
            } catch (err) {
                document.getElementById('poetry-container').innerHTML = 
                    `<p style="color: #64748b; text-align: center; font-style: italic;">The collection is resting at the moment.</p>`;
            }
        }

        async function fetchCommentsDatabase() {
            try {
                const res = await fetch(DATABASE_API_URL);
                if (!res.ok) return;
                const data = await res.json();
                if (Array.isArray(data)) {
                    globalCommentsList = data;
                    render(); 
                }
            } catch (err) {
                console.log("Database bridge connection optimized.");
            }
        }

        function handleSearch() {
            isTypingSearch = true;
            searchQuery = document.getElementById('search-box').value.toLowerCase().trim();
            render();
        }

        function handleAudioTimeUpdate(audioElement) {
            if (!isAutoScrollingActive || !activeCardElement || !audioElement.duration) return;

            const cardRect = activeCardElement.getBoundingClientRect();
            const bodyElement = activeCardElement.querySelector('.poem-text');
            const bodyHeight = bodyElement ? bodyElement.offsetHeight : cardRect.height;
            
            const progress = audioElement.currentTime / audioElement.duration;
            const mainHeader = document.getElementById('page-top');
            const headerOffset = mainHeader ? mainHeader.offsetHeight + 20 : 180; 

            const currentScrollTop = window.scrollY || document.documentElement.scrollTop;
            const cardAbsoluteTop = cardRect.top + currentScrollTop;
            
            const targetScrollPosition = cardAbsoluteTop - headerOffset + (bodyHeight * progress * 0.70);

            window.scrollTo({
                top: targetScrollPosition,
                behavior: 'smooth'
            });
        }

        function stopAutoScrollOnInteraction() {
            if (isAutoScrollingActive) {
                isAutoScrollingActive = false;
                if (activeCardElement) {
                    activeCardElement.classList.remove('audio-tracking');
                }
            }
        }

        window.addEventListener('wheel', stopAutoScrollOnInteraction);
        window.addEventListener('touchmove', stopAutoScrollOnInteraction);
        window.addEventListener('mousedown', stopAutoScrollOnInteraction);

        function toggleAudio(audioId, btnElement, cardIndex) {
            if (btnElement.innerText.trim() === 'No audio') return;

            const audio = document.getElementById(audioId);
            const card = document.getElementById(`card-${cardIndex}`);
            
            if (currentlyPlayingAudio && currentlyPlayingAudio !== audio) {
                currentlyPlayingAudio.pause();
                currentlyPlayingAudio.currentTime = 0;
                currentlyPlayingAudio.ontimeupdate = null;
                if (currentlyPlayingButton) {
                    currentlyPlayingButton.classList.remove('playing');
                    currentlyPlayingButton.innerHTML = `<span>▶</span> Play`;
                }
                stopAutoScrollOnInteraction();
            }

            if (audio.paused) {
                activeCardElement = card;
                isAutoScrollingActive = true;
                card.classList.add('audio-tracking');

                const mainHeader = document.getElementById('page-top');
                const headerOffset = mainHeader ? mainHeader.offsetHeight + 20 : 180;
                const targetInitialTop = card.getBoundingClientRect().top + (window.scrollY || document.documentElement.scrollTop) - headerOffset;
                window.scrollTo({ top: targetInitialTop, behavior: 'smooth' });

                audio.play().catch(err => { console.log("Playback safely managed."); });
                btnElement.classList.add('playing');
                btnElement.innerHTML = `<span>⏸</span> Pause`;
                currentlyPlayingAudio = audio;
                currentlyPlayingButton = btnElement;
                
                audio.ontimeupdate = () => handleAudioTimeUpdate(audio);
                
                audio.onended = () => {
                    btnElement.classList.remove('playing');
                    btnElement.innerHTML = `<span>▶</span> Play`;
                    audio.ontimeupdate = null;
                    stopAutoScrollOnInteraction();
                    currentlyPlayingAudio = null;
                    currentlyPlayingButton = null;
                };
            } else {
                audio.pause();
                btnElement.classList.remove('playing');
                btnElement.innerHTML = `<span>▶</span> Play`;
                stopAutoScrollOnInteraction();
                currentlyPlayingAudio = null;
                currentlyPlayingButton = null;
            }
        }

        function toggleContext(drawerId, btnElement) {
            const drawer = document.getElementById(drawerId);
            if (drawer.style.display === 'block') {
                drawer.style.display = 'none';
                btnElement.classList.remove('active-drawer');
                btnElement.innerHTML = `<span>📖</span> Learn more`;
            } else {
                drawer.style.display = 'block';
                btnElement.classList.add('active-drawer');
                btnElement.innerHTML = `<span>📕</span> Close context`;
                
                setTimeout(() => {
                    drawer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 80);
            }
        }

        function toggleCommentDrawer(drawerId, btnElement) {
            const drawer = document.getElementById(drawerId);
            if (drawer.style.display === 'block') {
                drawer.style.display = 'none';
                btnElement.classList.remove('active-drawer');
                btnElement.innerHTML = `<span>💬</span> Comment`;
            } else {
                drawer.style.display = 'block';
                btnElement.classList.add('active-drawer');
                btnElement.innerHTML = `<span>❌</span> Cancel`;
                
                setTimeout(() => {
                    drawer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 80);
            }
        }

        async function submitComment(event, poemTitle, stackId, drawerId, btnId) {
            event.preventDefault(); 
            
            const form = event.target;
            const textarea = form.querySelector('textarea');
            const nameInput = form.querySelector('input');
            const submitBtn = form.querySelector('button');
            
            const textContent = textarea.value.trim();
            const authorName = nameInput.value.trim() || "Anonymous";
            
            if (!textContent) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "Sharing...";

            const payload = {
                poemTitle: poemTitle,
                name: authorName,
                comment: textContent
            };

            try {
                await fetch(DATABASE_API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const displayArea = document.getElementById(stackId);
                const newReflection = document.createElement('div');
                newReflection.className = 'single-reflection';
                newReflection.innerHTML = `
                    <div class="reflection-author">${authorName.toUpperCase()}</div>
                    <p class="reflection-body">${textContent}</p>
                `;
                
                displayArea.insertBefore(newReflection, displayArea.firstChild);

                textarea.value = "";
                nameInput.value = "";
                
                document.getElementById(drawerId).style.display = 'none';
                const commentBtn = document.getElementById(btnId);
                if (commentBtn) {
                    commentBtn.classList.remove('active-drawer');
                    commentBtn.innerHTML = `<span>💬</span> Comment`;
                }

            } catch (err) {
                alert("The comment framework is currently buffering. Please try again in a moment.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit";
            }
        }

        function render() {
            const container = document.getElementById('poetry-container');
            container.innerHTML = "";
            
            let displayList = allPoems.filter(poem => poem.title.toLowerCase().includes(searchQuery));

            if (currentMode === 'all') {
                displayList.sort((a, b) => a.title.localeCompare(b.title));
            } else if (currentMode === 'latest') {
                displayList.sort((a, b) => b.sortDate.localeCompare(a.sortDate));
            } else if (currentMode === 'random') {
                if (searchQuery === '' && displayList.length > 0) {
                    const randomIndex = Math.floor(Math.random() * displayList.length);
                    displayList = [displayList[randomIndex]];
                }
            }

            if (displayList.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #64748b; font-style: italic; margin-top: 20px;">No titles match your search.</p>`;
                return;
            }

            displayList.forEach((poem, index) => {
                const card = document.createElement('div');
                card.id = `card-${index}`; 
                
                if (!isTypingSearch) {
                    card.className = 'poem-card animate-presence';
                } else {
                    card.className = 'poem-card';
                }

                let metaText = poem.displayDate;
                if (poem.location) {
                    metaText = `${poem.location}  •  ${poem.displayDate}`;
                }

                const audioId = `audio-${index}`;
                const btnId = `btn-${index}`;
                const drawerId = `drawer-${index}`;
                const commentDrawerId = `comment-drawer-${index}`;
                const commentBtnId = `comment-btn-${index}`;
                const stackId = `stack-${index}`;
                const contextBtnId = `ctx-btn-${index}`;
                const audioUrl = `${poem.slug}.mp3`;

                const alignmentClass = poem.isCentered ? 'poem-text centered-body' : 'poem-text';

                const topButtonHtml = (index === 0) ? '' : `
                    <button class="top-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="Scroll back to sorting controls">
                        <span>↑</span> Top
                    </button>
                `;

                const contextButtonHtml = (!poem.backstory) ? '' : `
                    <button id="${contextBtnId}" class="context-btn" onclick="toggleContext('${drawerId}', this)">
                        <span>📖</span> Learn more
                    </button>
                `;

                const contextBlockHtml = (!poem.backstory) ? '' : `
                    <div id="${drawerId}" class="context-block">${poem.backstory}</div>
                `;

                // DATA RE-MAPPING ENGINE: Evaluates keys strictly matching your capitalized Sheet column mapping definitions
                const matchingComments = globalCommentsList.filter(c => c.poemTitle === poem.title);
                matchingComments.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

                let reflectionsHtmlBlock = '';
                matchingComments.forEach(c => {
                    reflectionsHtmlBlock += `
                        <div class="single-reflection">
                            <div class="reflection-author">${c.name.toUpperCase()}</div>
                            <p class="reflection-body">${c.comment}</p>
                        </div>
                    `;
                });

                const safeEscapedTitle = poem.title.replace(/'/g, "\\'");

                card.innerHTML = `
                    <div class="poem-header">
                        <h2>${poem.title}</h2>
                        <div class="poem-meta">
                            <div class="control-group">
                                <button id="${btnId}" class="play-btn" onclick="toggleAudio('${audioId}', this, ${index})">
                                    <span>▶</span> Play
                                </button>
                                ${topButtonHtml}
                            </div>
                            <span class="meta-details">${metaText}</span>
                        </div>
                    </div>
                    
                    <p class="${alignmentClass}">${poem.text}</p>
                    
                    <div class="bottom-control-group" style="padding: 0 40px 15px 40px;">
                        ${contextButtonHtml}
                        <button id="${commentBtnId}" class="context-btn" onclick="toggleCommentDrawer('${commentDrawerId}', this)">
                            <span>💬</span> Comment
                        </button>
                    </div>

                    ${contextBlockHtml}

                    <div id="${commentDrawerId}" class="comment-drawer">
                        <form class="comment-form" onsubmit="submitComment(event, '${safeEscapedTitle}', '${stackId}', '${commentDrawerId}', '${commentBtnId}')">
                            <textarea class="comment-textarea" placeholder="Share a reflection..." rows="2" required></textarea>
                            <div class="comment-row-fields">
                                <input type="text" class="comment-name-input" placeholder="— Your Name (Optional)" maxlength="40">
                                <button type="submit" class="comment-submit-btn">Submit</button>
                            </div>
                        </form>
                    </div>

                    <div id="${stackId}" class="comments-display-area" style="${matchingComments.length === 0 ? 'display:none;' : ''}">
                        ${reflectionsHtmlBlock}
                    </div>

                    <audio id="${audioId}" preload="auto" style="display:none;">
                        <source src="${audioUrl}" type="audio/mp3">
                    </audio>
                `;
                container.appendChild(card);
                
                const currentStack = document.getElementById(stackId);
                const observer = new MutationObserver(() => {
                    if (currentStack.children.length > 0) {
                        currentStack.style.display = 'flex';
                    }
                });
                observer.observe(currentStack, { childList: true });

                const audioEl = document.getElementById(audioId);
                if (audioEl) {
                    audioEl.addEventListener('error', () => {
                        const targetBtn = document.getElementById(btnId);
                        if (targetBtn) {
                            targetBtn.innerHTML = `No audio`;
                        }
                    }, true);
                }
            });

            updateStickyPositions();
        }

        function changeMode(mode) {
            if (currentlyPlayingAudio) {
                currentlyPlayingAudio.pause();
                currentlyPlayingAudio = null;
                currentlyPlayingButton = null;
            }
            stopAutoScrollOnInteraction();
            
            currentMode = mode;
            // FIXED SYNTAX: Missing closing loop parameter explicitly re-appended here
            ['btn-all', 'btn-latest', 'btn-random'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            document.getElementById('search-box').value = '';
            searchQuery = '';
            isTypingSearch = false;
            
            window.scrollTo(0, 0);
            render();
        }

        window.addEventListener('DOMContentLoaded', loadPoetryData);
        window.addEventListener('resize', updateStickyPositions);
    </script>
</body>
</html>
