<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walter's Poetry</title>

<style>
body {
    background: #12161a;
    color: #e2e8f0;
    font-family: Georgia, serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container {
    max-width: 600px;
    width: 100%;
}

h1 {
    text-align: center;
    font-weight: 300;
}

button {
    background: #1e252b;
    color: #cbd5e1;
    border: 1px solid #334155;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
}

button:hover {
    background: #334155;
}

.poem {
    white-space: pre-wrap;
    margin: 30px 0;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: #1e252b;
    border: 1px solid #334155;
    color: white;
    border-radius: 6px;
}

.section {
    margin-top: 40px;
}

#audioPlayer {
    width: 100%;
    margin-top: 15px;
}
</style>
</head>

<body>
<div class="container">

<h1>Walter's Poetry</h1>

<div>
    <button onclick="prevPoem()">Prev</button>
    <button onclick="nextPoem()">Next</button>
</div>

<h2 id="title"></h2>
<div id="poem" class="poem"></div>

<audio id="audioPlayer" controls style="display:none;"></audio>

<!-- COMMENTS -->
<div class="section">
    <h3>Leave a reflection</h3>
    <input id="commentName" placeholder="Your name (optional)">
    <textarea id="commentText" rows="4" placeholder="Your reflection..."></textarea>
    <button onclick="submitComment()">Submit</button>
    <div id="commentStatus"></div>
</div>

<!-- SHARE -->
<div class="section">
    <h3>Share privately</h3>
    <input id="shareName" placeholder="Your name">
    <input id="shareEmail" placeholder="Email">
    <textarea id="shareMessage" rows="4" placeholder="Message..."></textarea>
    <button onclick="submitShare()">Send</button>
    <div id="shareStatus"></div>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwIndi3-qM17QbvPBpwwggsquob-GGxOWPABiwgsUbHuYPhR1RQho6KdXzu0JYIJ2w/exec";

let poems = [];
let currentIndex = 0;

/* =========================
   LOAD POEMS
========================= */
async function loadPoems() {
    const res = await fetch('poem-list.txt');
    const text = await res.text();

    poems = text.split('---').map(p => {
        const lines = p.trim().split('\n');

        let audio = null;
        let startIndex = 1;

        if (lines[1] && lines[1].startsWith("audio:")) {
            audio = lines[1].replace("audio:", "").trim();
            startIndex = 2;
        }

        return {
            title: lines[0],
            audio: audio,
            body: lines.slice(startIndex).join('\n')
        };
    });

    renderPoem();
}

/* =========================
   RENDER
========================= */
function renderPoem() {
    const poem = poems[currentIndex];

    document.getElementById('title').innerText = poem.title;
    document.getElementById('poem').innerText = poem.body;

    const player = document.getElementById('audioPlayer');

    if (poem.audio) {
        player.src = poem.audio;
        player.style.display = "block";
    } else {
        player.style.display = "none";
        player.pause();
    }

    // clear statuses
    document.getElementById('commentStatus').innerText = "";
    document.getElementById('shareStatus').innerText = "";
}

/* =========================
   NAVIGATION
========================= */
function nextPoem() {
    currentIndex = (currentIndex + 1) % poems.length;
    renderPoem();
}

function prevPoem() {
    currentIndex = (currentIndex - 1 + poems.length) % poems.length;
    renderPoem();
}

/* =========================
   COMMENT SUBMIT
========================= */
async function submitComment() {
    const name = document.getElementById('commentName').value;
    const comment = document.getElementById('commentText').value;
    const poemTitle = poems[currentIndex].title;

    const status = document.getElementById('commentStatus');

    if (!comment.trim()) {
        status.innerText = "Please write something.";
        return;
    }

    status.innerText = "Sending...";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                submissionType: "comment",
                name,
                comment,
                poemTitle
            })
        });

        const data = await res.json();

        if (data.status === "success") {
            status.innerText = "Reflection received.";
            document.getElementById('commentText').value = "";
        } else {
            status.innerText = "Error submitting.";
        }

    } catch (err) {
        status.innerText = "Network error.";
    }
}

/* =========================
   SHARE SUBMIT
========================= */
async function submitShare() {
    const name = document.getElementById('shareName').value;
    const email = document.getElementById('shareEmail').value;
    const message = document.getElementById('shareMessage').value;
    const poemTitle = poems[currentIndex].title;

    const status = document.getElementById('shareStatus');

    status.innerText = "Sending...";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                submissionType: "share_form",
                name,
                email,
                message,
                poemTitle
            })
        });

        const data = await res.json();

        if (data.status === "success") {
            status.innerText = "Sent.";
        } else {
            status.innerText = "Error.";
        }

    } catch (err) {
        status.innerText = "Network error.";
    }
}

/* INIT */
loadPoems();
</script>

</body>
</html>
