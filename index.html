<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walter's nondual poetry</title>
    <style>
        body { background-color: #12161a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif; line-height: 1.8; margin: 0; padding: 0 20px 40px 20px; display: flex; flex-direction: column; align-items: center; }
        header { position: sticky; top: 0; z-index: 100; width: 100%; max-width: 600px; padding-top: 40px; padding-bottom: 20px; background-color: #12161a; text-align: center; }
        .nav-controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .nav-btn, .home-btn { background-color: #1e252b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .nav-btn:hover, .nav-btn.active, .home-btn:hover { background-color: #334155; color: #f8fafc; border-color: #475569; }
        .search-container { width: 100%; max-width: 400px; margin: 0 auto 5px auto; }
        .search-input { width: 100%; background-color: #1e252b; color: #f1f5f9; border: 1px solid #334155; padding: 10px 16px; border-radius: 25px; box-sizing: border-box; outline: none; }
        main { width: 100%; max-width: 600px; display: flex; flex-direction: column; margin-top: 15px; }
        .poem-card { position: relative; background-color: #1e252b; border-radius: 12px; margin-bottom: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid #2d3742; }
        .poem-header { padding: 24px 40px 16px 40px; border-bottom: 1px solid #2d3742; }
        h2 { font-weight: 400; font-size: 1.6rem; margin: 0 0 12px 0; color: #f1f5f9; text-align: center; }
        .poem-text { font-size: 1.1rem; white-space: pre-line; color: #cbd5e1; padding: 30px 40px 15px 40px; }
        .play-btn, .context-btn { background-color: transparent; color: #64748b; border: 1px solid #334155; padding: 4px 14px; border-radius: 20px !important; cursor: pointer; }
        .play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .comment-drawer { display: none; margin: 0 40px 20px 40px; padding-top: 20px; border-top: 1px dashed #334155; }
        .comments-display-area { display: none; margin: 0 40px 40px 40px; padding-top: 15px; border-top: 1px solid #2d3742; flex-direction: column; }
    </style>
</head>
<body>
    <header id="page-top">
        <h1>Walter's nondual poetry</h1>
        <div class="nav-controls">
            <button class="nav-btn" id="btn-latest" onclick="changeMode('latest')">Latest</button>
            <button class="nav-btn" id="btn-all" onclick="changeMode('all')">A - Z</button>
            <button class="nav-btn" id="btn-random" onclick="changeMode('random')">Random</button>
            <button class="home-btn" id="btn-home" onclick="changeMode('landing')">🏠</button>
        </div>
        <div class="search-container"><input type="text" id="search-box" class="search-input" placeholder="Search titles..." oninput="handleSearch()"></div>
    </header>
    <main id="poetry-container"></main>
    <script>
        let allPoems = [], globalCommentsList = [], currentMode = 'landing', searchQuery = '';
        const DATABASE_API_URL = "https://script.google.com/macros/s/AKfycbyQEF7GLy3YAHvittxH0h0VEEqtyaedpK8i75C4LbhF7H2PiJ5ms6ZrGhRqDA0TIPajtw/exec";

        async function loadPoetryData() {
            try {
                const res = await fetch('poetry/--poem-list.txt');
                const text = await res.text();
                allPoems = text.split(/-----+/).map(block => {
                    const lines = block.split(/\r?\n/).filter(l => l.trim() !== "");
                    if(lines.length < 3) return null;
                    return { title: lines[2].trim(), slug: lines[2].toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').trim(), text: lines.slice(3).join('\n'), displayDate: lines[0], sortDate: lines[0], backstory: block.includes('===') ? block.split(/===+/)[1].trim() : null };
                }).filter(p => p !== null);
                
                const params = new URLSearchParams(window.location.search);
                if (params.get('search')) { currentMode = 'all'; searchQuery = decodeURIComponent(params.get('search')).toLowerCase(); }
                render();
            } catch (e) { console.error(e); }
        }

        function render() {
            const container = document.getElementById('poetry-container');
            container.innerHTML = "";
            const params = new URLSearchParams(window.location.search);
            
            // Clear all highlights
            ['btn-latest', 'btn-all', 'btn-random', 'btn-home'].forEach(id => document.getElementById(id).classList.remove('active'));

            if (currentMode === 'landing' && !params.get('search')) {
                container.innerHTML = `
                    <div class="poem-card">
                        <div class="poem-header" style="border:none; padding-bottom:0;"><h2>Click a button to start</h2></div>
                        <div class="poem-text" style="padding-top:0;"><strong>Latest:</strong> newest <strong>A - Z:</strong> alphabetical <strong>Random:</strong> universe decides!</div>
                        <div class="poem-text" style="border-top: 1px dashed #2d3742; font-size: 0.98rem; color: #94a3b8;">
                            Welcome. This space is offered simply as a place to share my poetry, haiku and a quiet understanding of nonduality with anyone who feels inclined to look.<br><br>There is nothing to buy, no identity to build, and no destination to reach. Inside, you will find a collection of poems written starting around 2019, alongside audio recordings where you can listen to them read aloud.<br><br><span style="font-style:italic;">More poems and audio files are being added weekly.</span>
                        </div>
                    </div>`;
                return;
            }

            let list = searchQuery ? allPoems.filter(p => p.title.toLowerCase().includes(searchQuery)) : allPoems;
            if (currentMode === 'latest') list.sort((a,b) => b.sortDate.localeCompare(a.sortDate));
            else if (currentMode === 'all') list.sort((a,b) => a.title.localeCompare(b.title));
            else if (currentMode === 'random') list = [list[Math.floor(Math.random() * list.length)]];

            list.forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'poem-card';
                card.innerHTML = `<div class="poem-header"><h2>${p.title}</h2></div><p class="poem-text">${p.text}</p>
                    <div style="padding: 0 40px 15px;"><button class="context-btn" onclick="document.getElementById('c-${i}').style.display='block'">💬 Comment</button></div>
                    <div id="c-${i}" class="comment-drawer"><form onsubmit="submitComment(event, '${p.title.replace(/'/g, "\\'")}', 'c-${i}')"><textarea name="comment" required></textarea><input name="name" placeholder="Name"><button type="submit">Submit</button></form></div>`;
                container.appendChild(card);
            });
        }

        async function submitComment(e, title, drawerId) {
            e.preventDefault();
            const f = e.target;
            await fetch(DATABASE_API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ poemTitle: title, name: f.name.value, comment: f.comment.value }) });
            alert("Submitted.");
            f.reset();
            document.getElementById(drawerId).style.display = 'none';
        }

        function changeMode(mode) {
            currentMode = mode;
            window.history.replaceState({}, document.title, window.location.pathname);
            render();
            if (mode !== 'landing') document.getElementById(`btn-${mode}`).classList.add('active');
        }
        function handleSearch() { searchQuery = document.getElementById('search-box').value.toLowerCase(); render(); }
        window.onload = loadPoetryData;
    </script>
</body>
</html>
